name: Build container (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'Gorvey/deepseek-harness'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Choose immutable image tag
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$image:$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build from this commit
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ steps.image.outputs.tag }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the packaged Web runtime
        shell: bash
        env:
          DSH_IMAGE: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          container="dsh-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker logs "$container" 2>&1 | sed -E 's/(token=)[A-Za-z0-9_-]+/\1[REDACTED]/g' || true
            docker rm -f "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm "$DSH_IMAGE" --version
          docker run -d --name "$container" --memory 768m "$DSH_IMAGE" \
            web --no-open --host 127.0.0.1 --port 3080
          ready=false
          for attempt in $(seq 1 90); do
            if docker exec "$container" node -e \
              "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"; then
              ready=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]; then
              break
            fi
            sleep 2
          done
          test "$ready" = true
          docker exec "$container" sh -c 'test -w "$DSH_HOME" && test -w /workspace'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image and report digest
        shell: bash
        env:
          DSH_IMAGE: ${{ steps.image.outputs.tag }}
          DSH_IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker push "$DSH_IMAGE"
          digest=$(docker buildx imagetools inspect "$DSH_IMAGE" --format '{{.Manifest.Digest}}')
          {
            echo "Source commit: $GITHUB_SHA"
            echo
            echo "Image: $DSH_IMAGE"
            echo
            echo '```bash'
            echo "docker pull $DSH_IMAGE_NAME@$digest"
            echo '```'
            echo
            echo 'RackNerd deployment is manual. This workflow does not access the server.'
          } >> "$GITHUB_STEP_SUMMARY"
